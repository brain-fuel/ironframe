version: 0.2.0
canon: 0.2.3
registry: canonical_refs.yaml
decisions: canonical_decisions.yaml
exemptions: canonical_exemptions.yaml
vetting: canonical_vetting
ignore:
  - .canon/
  - .canon-cache/
  - .ironframe/
  - target/
  # Build output: stack's, the WASM build's cabal, and npm's installed packages.
  - .stack-work/
  - dist-newstyle/
  - npm/node_modules/
  # Generated: the WASM core, its JSFFI glue (tools/wasm.sh) and the embedded
  # schemas (ironframe-dev generate); their sources are checked instead.
  - npm/core.wasm
  - npm/core_jsffi.js
  - src/Ironframe/Embedded.hs
  # Recorded data: the parity corpus captured from the Rust implementation.
  - corpus/
  - "**/.terraform/"
  - "**/.terraform.lock.hcl"
  - "*.md"
  - "!docs/**/*.md"
languages:
  folio:
    extensions: [.md]
    lexer: .canon/grammars/folio/FolioLexer.g4
    parser: .canon/grammars/folio/FolioParser.g4
    start: document
  make:
    extensions: [Makefile]
    lexer: .canon/grammars/make/canonically_commented/MakefileLexer.g4
    parser: .canon/grammars/make/canonically_commented/MakefileParser.g4
    start: makefile
  hcl:
    extensions: [.tf, .tfvars, .hcl]
    lexer: .canon/grammars/hcl/canonically_commented/HCLLexer.g4
    parser: .canon/grammars/hcl/canonically_commented/HCLParser.g4
    start: configFile
  haskell:
    extensions: [.hs]
    lexer: .canon/grammars/haskell/canonically_commented/HaskellLexer.g4
    parser: .canon/grammars/haskell/canonically_commented/HaskellParser.g4
    start: module
  javascript:
    extensions: [.js, .mjs, .cjs]
    lexer: .canon/grammars/javascript/canonically_commented/JavaScriptLexer.g4
    parser: .canon/grammars/javascript/canonically_commented/JavaScriptParser.g4
    start: program
