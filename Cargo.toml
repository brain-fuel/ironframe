[workspace]
resolver = "3"
members = [
    "crates/ironframe-attestation",
    "crates/ironframe-core",
    "crates/ironframe-config-service",
    "crates/ironframe-cli",
    "examples/kafka-app",
    "examples/petstore-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brain-fuel/ironframe"
rust-version = "1.90"

[workspace.dependencies]
ironframe-attestation = { path = "crates/ironframe-attestation", version = "0.1.0" }
ironframe-core = { path = "crates/ironframe-core", version = "0.1.0", default-features = false }
ironframe-config-service = { path = "crates/ironframe-config-service", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-appconfig = "1"
google-cloud-parametermanager-v1 = "1"
google-cloud-gax = { version = "1", default-features = false }
