[package]
name = "ironframe-core"
description = "Ironframe's manifest, settings, compose and OpenTofu generation, configuration sync and environment attestation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["aws", "gcp", "azure"]
aws = ["dep:aws-config", "dep:aws-sdk-appconfig"]
gcp = ["dep:google-cloud-parametermanager-v1", "dep:google-cloud-gax"]
azure = ["dep:hmac", "dep:base64"]

[dependencies]
ironframe-attestation.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
jsonschema.workspace = true
semver.workspace = true
tokio.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-appconfig = { workspace = true, optional = true }
google-cloud-parametermanager-v1 = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
reqwest.workspace = true
hmac = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
serde_yaml.workspace = true
