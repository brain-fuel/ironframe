[package]
name = "ironframe-cli"
description = "The ironframe command: validate a manifest, bring environments up and down, plan cloud deployments, sync configuration and write attestations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ironframe"
path = "src/main.rs"

[dependencies]
ironframe-core = { workspace = true, features = ["aws", "gcp", "azure"] }
ironframe-attestation.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
