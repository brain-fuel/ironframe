DEC-wiring-in-ironframe:
  status: decided
  question: Something must decide, per environment and per dependency, whether an application talks to the real dependency or to a stand-in, and must hand the application the endpoint. Where does that wiring live?
  answer: |
    In Ironframe, and only there. LawSpec knows nothing about LawTwin: business contracts never mention twins, endpoints or environments. LawTwin owns the stand-ins and never decides which environment uses what. Ironframe owns the environment manifests, the configuration service and its cloud sync, and the environment attestation, and never contains a contract or anything of a twin's insides; it runs a twin's image, hands it its configuration and records its declared conformance level. Decided by the owner for 0.1.0.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec, lawtwin]

DEC-three-planes:
  status: decided
  question: How do LawSpec, LawTwin and Ironframe divide the work so none of them drifts into another's concerns?
  answer: |
    As three planes. LawSpec, the business contract, owns the application's laws; a dependency is an ability whose production handler is the real client library. LawTwin, the stand-ins, owns dependency contracts as LawSpec packages, the twin servers, their control plane, conformance and record and replay. Ironframe, the wiring, owns which environment uses what, the configuration that tells applications where their dependencies are, and the attestation of what a run actually reached. The only thing that crosses from Ironframe to LawSpec is the attestation, in a tool-neutral format any tool may write, so LawSpec reads it without importing, naming or calling Ironframe or LawTwin. Decided by the owner for 0.1.0.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec, lawtwin]

DEC-config-service:
  status: decided
  question: How do applications learn where their dependencies are in each environment, without changing how they read configuration?
  answer: |
    Through an AppConfig-like layer that Ironframe owns: its own configuration service, a small HTTP server in a container that serves each environment's connection settings as JSON, as dotenv, or one value at a time, beside the sync targets of DEC-config-sync. The service serves a settings document Ironframe writes when it brings an environment up, re-read on each request, and never writes anything itself. The server is the npm package's Node host, npm/config-service.mjs, over the same WASM core as the command (DEC-haskell-wasm-core): the host only listens and reads the document, and every answer is the core's configService.handle. The image is built from config-service/Containerfile on node:22-alpine, uses no cloud SDK, and is tagged localhost/ironframe-config-service:0.1.0, the manifest's default. Decided by the owner for 0.1.0; the Node server over the core replaces the earlier Rust static binary, decided by the owner on 2026-10-20.
  opened: 0.1.0
  decided: 0.1.0
  refs: [aws-appconfig, node-22]

DEC-config-sync:
  status: decided
  question: Applications already read configuration from their cloud's configuration store or from env files. How do the settings reach them there?
  answer: |
    Ironframe syncs the same settings the configuration service serves into AWS AppConfig, GCP Parameter Manager and Azure App Configuration, and into env files for local runs, so applications read configuration the way they already do. AppConfig receives a hosted, freeform JSON profile and a deployment; Parameter Manager a JSON parameter with one version per distinct content; App Configuration one key-value per setting under a prefix and a label. A sync writes nothing when the target already holds the settings. What to create, when to write a version and when to leave a target alone are decided in the core (src/Ironframe/Sync.hs); each call into a cloud is an effect the Node host performs with the cloud's official JavaScript SDK, @aws-sdk/client-appconfig, @google-cloud/parametermanager and @azure/app-configuration, which also authenticate: the AWS SDK's default chain, Application Default Credentials, and the store's connection string, whose requests the Azure SDK signs, so Ironframe has no HMAC code of its own. The SDKs are the cloud boundary: the corpus checks the calls the core asks for and how it reads their answers, not the SDKs. LocalStack's image now requires an auth token, so the AWS client is not exercised against it. Decided by the owner for 0.1.0; the JavaScript SDKs replace the Rust SDKs and the bespoke Azure REST client, decided by the owner on 2026-10-20.
  opened: 0.1.0
  decided: 0.1.0
  refs: [aws-appconfig, aws-sdk-js-appconfig, gcp-parameter-manager, google-cloud-parametermanager-node, azure-app-configuration, azure-app-configuration-js]

DEC-haskell-wasm-core:
  status: decided
  question: Which language and runtime are Ironframe's command, library and configuration service written in, and how are they distributed?
  answer: |
    A pure Haskell core compiled to WebAssembly, hosted by a thin Node package, distributed on npm as ironframe. Every piece of logic is Haskell under src/Ironframe/: the manifest's parsing and checks, CALM 1.2 schema checks and identity resolution, decorators, real and twin binding resolution and its refusals, the exports (Mermaid, Graphviz, docify, settings, OpenTofu, compose), building and verifying the attestation, sync planning, the configuration service's answers and the command line. The core never does IO: it asks its host for each effect (DEC-host-protocol). It is a stack project (package.yaml, lts-24.58) compiled natively for its tests and to WASM by tools/wasm.sh with wasm32-wasi-cabal from ghc-wasm-meta (GHC 9.14) into npm/core.wasm and npm/core_jsffi.js, fingerprinted in npm/build.json by ironframe-dev integrity. The Node host (npm/host.mjs, launcher.mjs, protocol.mjs, clouds/) performs effects and nothing else; bin/ironframe.mjs runs the core's cli method, and config-service.mjs its configService.handle (DEC-config-service).

    The precedent is LawSpec's own compiler, a Haskell core compiled with ghc-wasm-meta, exported through GHC's JSFFI and run under node:wasi by a thin npm package; Ironframe mirrors its launcher, its tools/wasm.sh and its integrity check. Ironframe takes no Haskell dependency on LawSpec, and LawSpec never imports Ironframe: the attestation stays a neutral published JSON schema (schema/attestation-v1.schema.json) that Ironframe writes and LawSpec reads (DEC-three-planes).

    Trust boundaries. JSON Schema validation is a bespoke minimal validator (src/Ironframe/Json/Schema.hs and Regex.hs), since no maintained Haskell library validates draft 2020-12 as pure Haskell buildable under ghc-wasm: hjsonschema is draft 4 and needs PCRE's C library and Template Haskell, aeson-schema is draft 3 with Template Haskell, json-schema does not implement json-schema.org's language, and aeson-schemas is type-level. It implements $ref (JSON-pointer fragments, CALM's #/defs included), type, const, enum, required, minLength, maxLength, minItems, maxItems, minProperties, maxProperties, minimum, maximum, exclusiveMinimum, exclusiveMaximum, pattern, properties, patternProperties, additionalProperties, propertyNames, items, allOf, anyOf, oneOf, not and if/then/else; format is an annotation only, as jsonschema-rs treats it for 2020-12; and compiling a schema refuses every other keyword (contains, uniqueItems, multipleOf, prefixItems, the dependent and unevaluated keywords, $dynamicRef and the rest), so a schema change that needs one fails loudly. YAML is a bespoke pure-Haskell port (src/Ironframe/Yaml.hs) of unsafe-libyaml 0.2.11's reader, scanner, parser and emitter and of serde_yaml 0.9.34's loader and quoting rules, so YAML is read, refused and written, error messages included, as the Rust implementation did; it is checked against the corpus and about 100,000 differential cases against the real serde_yaml. JSON is written as serde_json 1.0.151 writes it, floats included, and YAML floats as ryu writes them. Semantic versions, RFC 3339 times and SHA-256 (the SHA package) are pure Haskell too. None of these emulations is proven equivalent to the Rust library it replaces; each is checked only against the corpus, and YAML also by the differential cases.

    The parity oracle is corpus/*.json, captured from the Rust implementation before the port: the inputs and exact outputs of every core operation, the command line and the configuration service, and corpus/libs-*.json for the libraries emulated (serde_json, serde_yaml, jsonschema-rs 0.33, semver 1.0.28, the time crate's RFC 3339, Rust's Debug quoting, serde's typed errors). Ironframe.Corpus checks every case with a scripted host, natively under stack test and in WASM under node --test; the command's corpus also runs through the real command. Deliberate differences: Azure requests are signed by the official SDK, not Ironframe's own HMAC code (DEC-config-sync); timestamps have the millisecond precision of Node's clock; the help and usage text is Ironframe's own, not clap's; and operating-system error texts are mapped from Node's error codes. The cloud SDKs are the cloud boundary, outside the corpus.

    Decided by the owner on 2026-10-20 for 0.1.0, replacing the earlier choice of Rust.
  opened: 0.1.0
  decided: 0.1.0
  refs: [ghc-wasm-meta, ghc-wasm-jsffi, node-wasi, node-22, unsafe-libyaml, serde-yaml, sha-package, json-schema-2020-12, jsonschema-rs, lawspec, fips-180-4, rfc3339, semver-2]

DEC-host-protocol:
  status: decided
  question: The core does no IO, yet a command reads files, runs podman, OpenTofu, the CALM CLI and git, speaks HTTP to twins' control planes, probes TCP ports, reads clocks and calls cloud SDKs. How does the core get those done?
  answer: |
    By effect replay. The core exposes one call: a JSON request {method, params, effects}, where effects holds the result of every effect performed so far, answered by {done: value}, {failed: message}, or {effect: request, index: n}, the next effect the host must perform, n being how many results it has. The host performs that effect, appends its result and calls again with the same method and parameters; the core runs the method from the start over the longer list, so it replays deterministically and asks for the same effects in the same order. A malformed request or an unknown method is answered {error: message}. Every effect is a JSON object named by its effect field: files (readFile, writeAtomically, writeFile, removeFile, removeTree, createDir, canonicalize, cwd), the environment and tools (env, locate, run, readStdin, tempDir, processId), network and time (http, tcpProbe, sleep, now, monotonic, uuid), output (print, progress), and the cloud calls aws.*, gcp.* and azure.* (DEC-config-sync). A result is {ok: value} or {error: text}, with notFound for a missing file. The host is npm/host.mjs, the loop npm/protocol.mjs; the corpus's scripted host and the tests' native host answer the same effects, which is how the corpus checks a command's effects in order. docs/reference/host-protocol.md lists each effect's fields and result. Decided by the owner on 2026-10-20 for 0.1.0, with DEC-haskell-wasm-core.
  opened: 0.1.0
  decided: 0.1.0
  refs: [ghc-wasm-jsffi]

DEC-opentofu:
  status: decided
  question: How are twins deployed to AWS, GCP and Azure?
  answer: |
    With OpenTofu, or Terraform, which reads the same modules. The repository ships one module per cloud under modules/, AWS ECS on Fargate behind a network load balancer, GCP Cloud Run and Azure Container Apps, each running one twin image and exposing its ports. ironframe writes a cloud environment's root module as JSON from the manifest, one module instance per twin, and reads each twin's endpoint back from its output. Each module validates and plans against a mocked provider in its own tofu test. Decided by the owner for 0.1.0.
  opened: 0.1.0
  decided: 0.1.0
  refs: [opentofu, opentofu-testing]

DEC-podman-compose:
  status: decided
  question: How do twins and local stand-ins run on a developer's machine?
  answer: |
    With podman and a compose file Ironframe generates from the manifest, run by podman compose. Containers are labelled with their project, environment and dependency so status and down find them, and published ports keep their numbers, so the endpoint a twin is reached at is the one the application is told. podman is found through IRONFRAME_PODMAN, then PATH, then /opt/podman/bin/podman, where the macOS installer puts it. Short image names are Docker Hub names, as Docker reads them. Decided by the owner for 0.1.0.
  opened: 0.1.0
  decided: 0.1.0
  refs: [podman, compose-spec]

DEC-vetting-deferred:
  status: decided
  question: Ironframe adopts canon from its first commit. When are its comments, pages, decisions and references vetted?
  answer: |
    At 1.0. Every comment, page, decision and reference is ingested pending from the start, and canonical_exemptions.yaml exempts them all with revisit 1.0.0, so the debt is counted and not yet due, as LawSpec defers its own. Decided by the owner for 0.1.0.
  opened: 0.1.0
  decided: 0.1.0
  refs: [canon]

DEC-manifest-shape:
  status: open
  question: What does ironframe.yaml say, and how is it checked?
  answer: |
    Proposed for 0.1.0, until the owner decides. A versioned manifest names its project, declares each dependency once with the settings the application reads as templates over the bound endpoint (${endpoint}, ${host}, ${port}, ${credentials}, ${kind}, ${name}), and binds every declared dependency in every environment to `real`, with its endpoint, a credentials reference and optionally an image to run on podman, or to `twin`, with its image, version, configuration, declared conformance level and ports. An environment names its runtime, podman, aws, gcp or azure, the cloud inputs a cloud runtime needs, its sync targets and optionally a configuration service. It is checked in two passes, its JSON Schema and then the rules across fields, each reporting every problem with the field's dotted path. Ironframe's generated files live in .ironframe/<environment>/, ignored by git.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [json-schema-2020-12]

DEC-attestation-format:
  status: open
  question: What does an environment attestation record, so that a tool such as lawspec evidence can tell which obligations ran against stand-ins without knowing which tool wired the environment?
  answer: |
    Proposed for 0.1.0, until the owner decides. A JSON document of format environment-attestation, version 1: the environment's name; the run's id and its start and record times in RFC 3339; optionally the producer's name and version, which no reader may depend on; and per dependency its name, the endpoint the run was wired to, whether it answered, its kind, real or stand-in, and for a stand-in its product, version and declared conformance level, and optionally the stand-in's seed and the digest and length of its history (DEC-history-digest). Readers ignore fields they do not know, so fields are added without a version change; a change that would mislead an older reader raises the version. Nothing in it names Ironframe, LawSpec or LawTwin. Ironframe writes it during up and on demand with ironframe attest, reusing the run up started. Whether an endpoint answered is a TCP connection that stays open a moment, since podman's port forwarder accepts connections before anything listens behind it.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [rfc3339, json-schema-2020-12, lawspec]

DEC-credentials-by-reference:
  status: open
  question: How does a manifest say how a real dependency is authenticated without Ironframe handling secrets?
  answer: |
    Proposed for 0.1.0, until the owner decides. A binding names a credentials reference, <scheme>:<location>, with scheme env, file, aws-secretsmanager, gcp-secretmanager, azure-keyvault or vault. Ironframe checks the scheme, passes the reference on through ${credentials}, and never reads the secret, so no secret lands in a settings document, an env file or a cloud configuration store.
  opened: 0.1.0
  revisit: 1.0.0

DEC-cloud-run-http-only:
  status: open
  question: Cloud Run serves HTTP and gRPC on one port per service. How does a twin of a raw TCP protocol, such as Kafka, run on GCP?
  answer: |
    The gcp-cloud-run module serves HTTP twins only, and the manifest refuses a GCP twin of protocol http with more than one port. A twin of protocol tcp runs on Compute Engine instead, as DEC-gce-for-tcp-twins proposes; a GKE Autopilot module remains the alternative for teams that already run GKE.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [cloud-run-ports, container-apps-tcp]

DEC-twin-control-plane:
  status: open
  question: A test needs a twin seeded, in a given state and showing given faults from the moment the application starts, and a person needs to drive it while it runs. How does Ironframe do that without knowing what the twin does inside?
  answer: |
    Proposed for 0.1.x, until the owner decides. A twin binding may give seed and contract, which reach the twin as keys of TWIN_CONFIG, a state to force and faults to raise, and admin, where its control plane is reached: a port published on podman (container port 9644, LawTwin's default, unless container_port says otherwise) or a URL in a cloud. up waits for the control plane's /healthz, checks the seed through GET /v1/twin and sets it with POST /v1/seed when the twin reports another, forces the state with POST /v1/state and raises each fault with POST /v1/faults/{name}, in order, and stops on a refusal. What it learnt is kept in .ironframe/<environment>/twins.json. ironframe twin <dependency> inspect, force, fault, faults, history, advance, seed, reset and laws speak the same admin API with the meaning and exit statuses lawtwin gives them (2 for a refused state), calling the API directly rather than the lawtwin binary, so the command works where lawtwin is not installed. Ironframe knows the API LawTwin documents and never a twin's insides: a fault's name and parameters are passed on unread.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawtwin, lawtwin-control-plane]

DEC-conformance-from-report:
  status: open
  question: A twin's conformance level is declared by its maker per release. How does a manifest state it so that a level typed by hand cannot drift from the evidence behind it?
  answer: |
    Proposed for 0.1.x, until the owner decides. conformance is either a level, as before, or a mapping with report, a conformance report beside the manifest, image_label, a label of the twin's image, and an optional declared level. A report is read when the manifest is loaded, in either of LawTwin's two shapes (a level object with number and name, or a level word); the declared level must name the report's level by name, number or <number>-<name>, and a report that says which release, twin or contract it is for must be for this twin's version, image and contract, or the manifest is refused with the field at fault. A label is read by up once the image is present and checked the same way. The attestation records the report's level name, else the label's, else the declared level, else unrated.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawtwin]

DEC-history-digest:
  status: open
  question: Evidence that cites a run against a stand-in should say exactly what the application talked to. What does the attestation record of a stand-in's run beyond its product, version and level?
  answer: |
    Proposed for 0.1.x, until the owner decides. Three optional fields of stand_in, added without a version change since readers ignore what they do not know: seed, the seed of the stand-in's random choices; history_digest, sha256: and 64 lowercase hex digits over the stand-in's history as its maker's tool exports it; and history_entries, how many entries it held. Ironframe reads them from the control plane when it attests (GET /v1/twin and GET /v1/history?format=jsonl) and keeps the history beside the attestation, .ironframe/<environment>/history/<dependency>.jsonl, so the digest can be checked and the history replayed. A deterministic twin given the same seed and the same requests writes the same history, so the same digest identifies the same run.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawtwin-control-plane, fips-180-4]

DEC-gce-for-tcp-twins:
  status: open
  question: Where does a twin of a TCP protocol of its own, such as Kafka, run on GCP?
  answer: |
    Proposed for 0.1.x, until the owner decides. On a Compute Engine instance from modules/gcp-compute-engine: Container-Optimized OS, the image started by a systemd unit written through cloud-init, a reserved address, internal by default and external when public, and a firewall rule for the twin's TCP ports from allowed_cidr_blocks. A twin binding says protocol tcp to be deployed there instead of Cloud Run; http stays the default so existing manifests keep their meaning. advertise_variable names the environment variable the twin reads the address it tells clients from, which the module sets to the reserved address and first port, since a Kafka client connects to the address the broker advertises. The control plane is not opened by the firewall unless its port is among the twin's ports.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [cloud-run-ports, gce-container-optimized-os, cos-cloud-init]

DEC-calm-architecture:
  status: open
  question: The cross-project path to 1.0 makes Ironframe own CALM service nodes and dependency edges. What is the source of an application's wiring, and how is it checked?
  answer: |
    Proposed for gate 2 of the 1.0 path, until the owner decides. A CALM 1.2 architecture document: service and dependency nodes, connects relationships from an application to each dependency it reaches, and any other CALM element, which Ironframe keeps but does not read. Ironframe checks the document against the CALM 1.2 meta schemas published by FINOS, embedded unchanged (schema/calm/1.2, Apache-2.0) so a check needs neither the network nor the CALM CLI, then that every unique-id is unique across nodes, interfaces, relationships and flows and that every relationship names nodes the document has. ironframe validate --calm-cli also runs the CALM CLI's own calm validate when it is installed.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [calm-1-2, calm-cli, lawspec-pre-1-0-path]

DEC-calm-decorators:
  status: open
  question: How are LawSpec contracts and per-environment bindings attached to a CALM architecture without changing the architecture or CALM?
  answer: |
    Proposed for gate 2, until the owner decides. As CALM 1.2 decorators, standalone documents that apply to elements by unique-id, kept in a decorators file beside the architecture (<name>.decorators.json by default, an array or {"decorators": [...]}) so other tools' decorators may share it. Three types, each a JSON Schema that extends CALM's base decorator and owns its data: ironframe-contract (on an application node, the LawSpec package it implements; on a dependency node, the package, version requirement, abilities and accepted conformance levels its binding must satisfy; on a connects relationship, the application abilities whose production handler reaches the destination and the settings the application reads it through), ironframe-binding (one node in one environment: real with its provider, a twin with the contract identity it stands in for, or an application's deployment, external or managed) and ironframe-environment (applied to the system node: the project, runtime, cloud inputs, sync targets and configuration service). A decorator must target the architecture by file name or unique-id. CALM's documentation gives decorators a $schema that its base schema's closed top level does not list; Ironframe accepts it.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [calm-decorators, calm-1-2]

DEC-calm-identity:
  status: open
  question: Evidence must carry architecture, contract, implementation and run identities. What identifies each?
  answer: |
    Proposed for gate 2, until the owner decides. The architecture by its document's and its decorators' sha256 digests over their bytes, its own unique-id and the unique-ids of the elements a run involved; the planned wiring by the sha256 digest of the resolved topology's JSON; a contract by LawSpec package name, version (exact for what an application implements and what a twin stands in for, a Cargo-style requirement for what a dependency accepts) and abilities by resolved identity, unit::ability::Name; an implementation by kind (application, real-provider or fixture), product, version, commit (git HEAD, -dirty when the application's directory has changes) and image digest when podman has the image; a run by a fresh UUID, its start and its completion.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawspec, semver-cargo, fips-180-4]

DEC-calm-resolution:
  status: open
  question: How does Ironframe turn an architecture and its decorators into what one environment is?
  answer: |
    Proposed for gate 2, until the owner decides. ironframe resolve resolves one environment into a resolved topology (format ironframe-resolved-topology, version 1): the architecture identity, the environment, project and runtime, each application node with its contract and deployment, each dependency node with its contract, its binding decorator, real or twin, the provider or the twin's identity, and how many application edges reach it (a shared dependency has more than one), and each application-to-dependency edge with the abilities and settings it carries. The topology is planned wiring, the identity every later run refers to. It is lowered onto the manifest model, one dependency per dependency node, so up, down, status, plan, sync, attest and twin work on it unchanged.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [calm-1-2]

DEC-calm-refusals:
  status: open
  question: What does Ironframe refuse to resolve, and how does it say so?
  answer: |
    Proposed for gate 2, until the owner decides. Every problem of a resolution is reported at once, each naming the element or decorator at fault: an architecture that breaks CALM 1.2, repeats a unique-id or relates nodes it lacks; a decorator that breaks its schema, targets another architecture or applies to an element the architecture lacks; an environment no decorator declares (naming those declared) or declared twice; two contracts on one element, or a contract on the wrong kind of element; a connects relationship from an application to a dependency without a connection contract (unresolved); a dependency without a binding in the environment (unresolved), with two bindings (ambiguous), or that no application reaches; a binding of an undeclared environment or of a node without a contract; an ability consumed that is not of the application's package, or consumed over two edges by one application (ambiguous); one setting read two ways; a twin incompatible with its node's contract (DEC-calm-compatibility); and every rule ironframe.yaml applies to a binding's own fields, named by node and decorator.
  opened: 0.1.0
  revisit: 1.0.0

DEC-calm-compatibility:
  status: open
  question: When is a twin a compatible stand-in for a dependency node?
  answer: |
    Proposed for gate 2, until the owner decides. When the contract identity its binding says it stands in for has the node's package, a version within the node's requirement and every ability the node requires; when its conformance report, read when the architecture is resolved, agrees with the twin's declared level, release and image and checked the same package; and when its level, by the report's name or number or else as declared, is one the node accepts. A real binding is the dependency itself and satisfies its contract by definition; its provider name and version are recorded, not judged.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawtwin, semver-cargo]

DEC-manifest-compat:
  status: open
  question: What becomes of ironframe.yaml now that a CALM architecture is the source of wiring?
  answer: |
    Proposed for gate 2, until the owner decides. ironframe.yaml stays, unchanged, as the compatibility layer for an application without an architecture, and as Ironframe's internal model: a resolved CALM environment is lowered onto it, its bindings checked by the same rules, so every verb takes either --manifest or --architecture. A manifest has no contract identities, so its attestations name dependencies, not abilities, and carry no architecture; new projects should use an architecture. Migration is by hand: each dependency becomes a node, its settings move to the connection contract of each edge reaching it, and each environment's bindings become binding decorators.
  opened: 0.1.0
  revisit: 1.0.0

DEC-calm-exports:
  status: open
  question: What is generated from a resolved topology, and how is it kept true to it?
  answer: |
    Proposed for gate 2, until the owner decides. Each export is generated from the one resolved topology and works without Ironframe deploying anything, so another deployment tool can use it: the topology as JSON; a Mermaid or Graphviz diagram with each dependency labelled and classed real or twin; a copy of the architecture with each binding in its node's name and metadata, still CALM 1.2, for CALM's own tooling, and that copy rendered through calm docify with CALM's block-architecture widget (only docify registers CALM's widgets); each application's settings, as dotenv or JSON, rendered from its own edges only; the OpenTofu root of a cloud environment from the existing modules; and the compose file of a podman environment. Ironframe's tests compare the diagram, the root and the settings against the topology, so an export that drops a node, an edge, a twin or a setting is caught.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [calm-cli, opentofu]

DEC-calm-deployment:
  status: open
  question: Who deploys the application in an environment?
  answer: |
    Proposed for gate 2, until the owner decides. Its own tooling by default (external): Ironframe injects its settings through the application's normal configuration, synced env files and cloud stores, and the exported settings, and never needs to run it. Optionally Ironframe runs it (managed), as a local process in a directory or as a podman image on the host's network, built from a context when podman lacks it, with the application's settings in its environment; ironframe app runs it once and attests the run.
  opened: 0.1.0
  revisit: 1.0.0

DEC-calm-run:
  status: open
  question: How is a run of an application against a resolved environment attested so that LawSpec 0.26 reads it?
  answer: |
    Proposed for gate 2, until the owner decides. ironframe run (and ironframe app for a managed application) writes a running attestation before the command starts, hands the command the application's settings and the attestation's path in IRONFRAME_ATTESTATION, runs it, and rewrites the attestation as completed when it exits; ironframe attest --app and --complete do the same around a run another tool performs. Each dependency record is named by the application ability that reaches it, as LawSpec matches what a law relies on, one record per consumed ability. The attestation is kept outside the application's project, under .ironframe/<environment>/runs, since LawSpec digests the project's files into the inputs its native results are keyed by.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawspec]

DEC-calm-planned-vs-completed:
  status: open
  question: How does evidence tell planned wiring from completed execution?
  answer: |
    Proposed for gate 2, until the owner decides. The planned wiring is the resolved topology, written by up to .ironframe/<environment>/topology.json and cited by digest. An attestation's execution says what it records: wired (up and attest: endpoints probed, nothing ran), running (a run under way) or completed (with exit code and finish time). The version 1 fields of a run's attestation, including each stand-in's history digest, record the run as it began and stay the same when it completes, because LawSpec keys a law's native result by them; what was observed at completion, whether each endpoint still answered and each twin's history digest and length then, is under each dependency's completed. A reader that knows execution can refuse anything but a completed run as evidence; LawSpec 0.26 does not yet, and proposals/lawspec-completed-run-attestations.md proposes it.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawspec]

DEC-attestation-architecture:
  status: open
  question: Does the attestation change version to carry architecture, contract, implementation and run identities?
  answer: |
    Proposed for gate 2, until the owner decides. No: version 1 gains optional fields, which LawSpec 0.26 and every version 1 reader ignore, so the same document is evidence for them unchanged: architecture (documents, digests, topology digest, elements), application (node, contract, implementation), execution (DEC-calm-planned-vs-completed), and per dependency node, edge, contract, implementation (real-provider or fixture, product, version, image digest), completed, and stand_in.stands_in_for. A version 2 would be needed only by a change that misleads a version 1 reader.
  opened: 0.1.0
  revisit: 1.0.0
  refs: [lawspec]

DEC-canon-haskell-field-haddock:
  status: decided
  question: canon 0.2.2 reports that a doc comment is not attached to any unit at src/Ironframe/Manifest/Types.hs line 114, a record field's Haddock written after the separating comma (a line holding a comma and then the Haddock opener, before the line declaring twinReport), the layout ormolu and fourmolu write and GHC and Haddock accept. How is the file checked meanwhile?
  answer: |
    Until canon attached a Haddock comment that follows a record's comma to the field after it, canon.yaml ignored src/Ironframe/Manifest/Types.hs alone, and the code was not reshaped for canon. canon 0.2.3 binds a record field's Haddock to its field wherever Haddock reads it (canon's DEC-haskell-field-haddock), so canon.yaml names canon 0.2.3, the ignore is removed, and the file is checked as written, unchanged; twinReport is a unit of kind field whose Why is the comment.
  opened: 0.1.0
  decided: 0.1.0
  refs: [canon]
