REQ-manifest-validation:
  kind: requirement
  title: Ironframe reads ironframe.yaml against its JSON Schema and then its rules across fields, and reports every problem of a pass at once, each with the dotted path of the field at fault
  locator: docs/reference/manifest.md
REQ-settings-resolution:
  kind: requirement
  title: Ironframe resolves each dependency's endpoint once per environment, pinned, deployed or localhost and the first port, and renders the application's settings from it
  locator: docs/reference/manifest.md
REQ-compose-generation:
  kind: requirement
  title: A podman environment's compose file is generated whole from the manifest, one labelled service per container, ports kept, the twin's configuration passed in TWIN_CONFIG
  locator: docs/how-to/run-an-environment-locally.md
REQ-missing-image-fails-clearly:
  kind: requirement
  title: ironframe up checks every image, pulling those absent, before anything starts, and when any stays missing it starts nothing and names each dependency, image and reason
  locator: docs/how-to/run-an-environment-locally.md
REQ-config-service-serves-settings:
  kind: requirement
  title: The configuration service serves each environment's settings as JSON, dotenv and single values, re-reads its settings document, and answers what it lacks with a 404 naming what exists
  locator: docs/reference/config-service.md
REQ-config-sync-idempotent:
  kind: requirement
  title: Each sync target receives an environment's settings, creates what is missing, and writes nothing when it already holds them
  locator: docs/how-to/sync-configuration.md
REQ-attestation-round-trip:
  kind: requirement
  title: An environment attestation reads back exactly as written, satisfies its published schema, tolerates added fields, and refuses documents that would mislead a reader
  locator: docs/reference/attestation.md
REQ-cloud-root-module:
  kind: requirement
  title: A cloud environment's OpenTofu root deploys each twin through its cloud's module, configures the provider from the environment's inputs, and outputs every twin's endpoint for up to read back
  locator: docs/how-to/deploy-twins-to-a-cloud.md
REQ-modules-plan:
  kind: requirement
  title: Each OpenTofu module validates and plans against a mocked provider, runs the twin image with its ports and TWIN_CONFIG, and refuses inputs its cloud cannot serve
  locator: docs/how-to/deploy-twins-to-a-cloud.md
REQ-example-reads-config:
  kind: requirement
  title: The example application reads its Kafka bootstrap servers from its own configuration and speaks the Kafka protocol to them, knowing nothing of Ironframe
  locator: docs/tutorials/wire-the-kafka-example.md
lawtwin-control-plane:
  kind: article
  title: LawTwin, the control plane; the admin API every twin serves, and the lawtwin commands that speak it
  locator: https://github.com/brain-fuel/lawtwin/blob/main/docs/reference/control-plane.md
