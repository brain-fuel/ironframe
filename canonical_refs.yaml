REQ-twin-start-setup:
  kind: requirement
  title: ironframe up waits for each twin's control plane, sets its seed, forces its state and raises its faults in order, stopping on a refusal, and ironframe twin drives the control plane with lawtwin's meaning and exit statuses
  locator: docs/how-to/drive-a-twin.md
REQ-conformance-matches-report:
  kind: requirement
  title: A twin's conformance level is read from its report or image label, a declared level that disagrees is refused with the field at fault, and so is a report for another release, twin or contract
  locator: docs/reference/manifest.md
REQ-attestation-stand-in-run:
  kind: requirement
  title: The attestation records a stand-in's seed and the sha256 digest and length of its history, which round-trip, satisfy the schema, and match the history kept beside the attestation
  locator: docs/reference/attestation.md
REQ-end-to-end-with-twins:
  kind: requirement
  title: ironframe up local starts LawTwin's Kafka and HTTP twins in podman, both example applications run against them, ironframe attest lists each stand-in with its level, seed and history digest, and ironframe down removes them
  locator: docs/tutorials/wire-the-kafka-example.md
